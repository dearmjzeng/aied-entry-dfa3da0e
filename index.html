<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GCGS AIED Community</title>
<meta http-equiv="refresh" content="1;url=https://category-raises-ministers-clan.trycloudflare.com/">
<link rel="icon" href="data:,">
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#f6f8fa;color:#1f2328;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
  .card{width:min(92vw,420px);padding:32px 28px;background:#fff;border:1px solid #d0d7de;border-radius:14px;
        text-align:center;box-shadow:0 1px 3px rgba(31,35,40,.06)}
  h1{margin:0 0 6px;font-size:19px;font-weight:600;letter-spacing:.2px}
  .sub{margin:0 0 22px;font-size:13px;color:#656d76}
  .bar{height:3px;border-radius:2px;background:#eaeef2;overflow:hidden;margin:0 0 20px}
  .bar i{display:block;height:100%;width:40%;background:#0969da;border-radius:2px;
         animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-105%)}100%{transform:translateX(260%)}}
  a.btn{display:inline-block;padding:9px 18px;border-radius:8px;background:#1f883d;color:#fff;
        font-size:14px;font-weight:500;text-decoration:none}
  a.btn:hover{background:#1a7f37}
  .hint{margin:16px 0 0;font-size:12px;color:#8b949e;word-break:break-all}
  .hint a{color:#0969da;text-decoration:none}
</style>
</head>
<body>
  <main class="card">
    <h1>GCGS AIED Community</h1>
    <p class="sub">正在进入学习社区…</p>
    <div class="bar"><i></i></div>
    <a class="btn" id="go" href="https://category-raises-ministers-clan.trycloudflare.com/">立即进入</a>
    <p class="hint">若未自动跳转，请点击上方按钮<br><a id="raw" href="https://category-raises-ministers-clan.trycloudflare.com/">https://category-raises-ministers-clan.trycloudflare.com</a></p>
  </main>
  <script>
    (function () {
      var target = document.getElementById('go').getAttribute('href');
      setTimeout(function () { window.location.replace(target); }, 400);
    })();
  </script>
</body>
</html>
